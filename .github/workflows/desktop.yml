name: Desktop CI
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.26'
      - run: uv run --locked --python 3.12 python scripts/release.py
      - run: uv run --locked --python 3.12 pytest --no-cov scripts/test_release.py

  native:
    name: Native build and bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-2025
            bundles: nsis
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.26'
          enable-cache: true
      - run: uv sync --locked --python 3.12.13 --group desktop-build
      - run: uv run --locked pytest --no-cov tests/desktop
      - run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.92.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: cargo fmt --all -- --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: uv run --locked --group desktop-build python desktop/scripts/freeze_bridge.py
      - run: npm run tauri -- build --ci --no-sign --target ${{ matrix.target }} --config src-tauri/bundle.conf.json --bundles ${{ matrix.bundles }} -- --locked
        working-directory: desktop
      - name: Mount and exercise the unsigned macOS installer
        if: runner.os == 'macOS'
        run: |
          bundle=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          uv run --locked --group desktop-build python desktop/scripts/qualify.py "$bundle"/dmg/*.dmg
          uv run --locked python desktop/scripts/release.py --bundle "$bundle" --out desktop/dist-release --mac
      - name: Install, exercise and uninstall the unsigned NSIS installer
        if: runner.os == 'Windows'
        run: |
          $bundle = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $installer = Get-Item "$bundle/nsis/*-setup.exe"
          uv run --locked --group desktop-build python desktop/scripts/qualify.py $installer.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --locked python desktop/scripts/release.py --bundle $bundle --out desktop/dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-unsigned-${{ matrix.platform }}
          path: desktop/dist-release/
          if-no-files-found: error
          retention-days: 7
