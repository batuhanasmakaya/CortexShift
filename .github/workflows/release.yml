name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.26'
      - run: uv sync --locked --python 3.12
      - name: Guard release tag and clean source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run python scripts/release_check.py --require-clean --tag "$RELEASE_TAG"
      - run: uv build
      - run: uv run python scripts/release_check.py --dist dist --checksums
      - run: uvx --from 'twine==7.0.0' twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv run python scripts/artifact_smoke.py --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - name: Verify exact artifacts
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Keep checksum manifest outside PyPI upload directory
        run: mv dist/SHA256SUMS SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
  assets:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - run: cd dist && sha256sum --check SHA256SUMS
      - name: Attach immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
