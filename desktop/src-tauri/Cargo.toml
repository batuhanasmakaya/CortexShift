[package]
name = "cortexshift-desktop"
version = "0.2.0"
description = "Local workspace browser for CortexShift"
edition = "2021"
rust-version = "1.92"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
tauri = { version = "2", features = ["test"] }
